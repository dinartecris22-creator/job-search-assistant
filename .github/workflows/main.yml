name: Job Search Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Job Search Assistant
        run: python jobs.py

      - name: Save job results
        run: |
          git config user.name "job-search-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_found.md

          if git diff --cached --quiet; then
            echo "No changes in job results."
          else
            git commit -m "Update job opportunities"
            git push
          fi
